# main ブランチに push すると自動でビルドして GitHub Pages に公開します。
# 初回のみ GitHub の Settings > Pages > Source を「GitHub Actions」に設定してください。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # 手動実行もできます

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # 公開処理の途中で打ち切られないようにします

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node.js 22 のサポート期限は2027年春です。
          # それ以降にビルドが失敗したら、この数字を新しい偶数（24など）に上げてください。
          node-version: 22
          cache: npm
      - run: npm ci
      # 公開しているのは gachi/ フォルダのデザインです（2026年9月に切り替え）。
      # 旧デザイン（直下の src/）に戻すときは、下の2か所を
      #   run: npm run build:old  ／  path: ./dist
      # に書き換えてください（詳しくは gachi/HANDOVER.md）。
      - run: npm run build
      # 旧デザインを参考用に /old/ へ置きます（不要になったらこの2行を消してください）
      - run: npm run build:archive
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./gachi/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
