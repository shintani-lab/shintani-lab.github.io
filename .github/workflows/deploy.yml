# main ブランチに push すると自動でビルドして GitHub Pages に公開します。
# 初回のみ GitHub の Settings > Pages > Source を「GitHub Actions」に設定してください。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # 手動実行もできます

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # 公開処理の途中で打ち切られないようにします

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node.js 22 のサポート期限は2027年春です。
          # それ以降にビルドが失敗したら、この数字を新しい偶数（24など）に上げてください。
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # 新デザイン（gachi/ フォルダ）を、比較用に /gachi/ の下へ公開します。
      # 新デザインを本番にするときは、gachi/HANDOVER.md の「新デザインを本番にする場合」を見てください。
      - name: Build gachi (comparison)
        run: npx astro build --root gachi
        env:
          GACHI_BASE: /gachi/
      - run: cp -r gachi/dist dist/gachi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
