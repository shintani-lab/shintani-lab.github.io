# サイト全体の基本情報
# 【提供】2026-08-24 新谷先生より正式な掲載情報を受領
# ※ ★印は未確定の項目

lab:
  name_ja: 認知言語学・言語データ分析研究室
  # 大学公式ページの英語表記に合わせています
  name_en: Cognitive Linguistics and Language Data Analysis Laboratory

professor:
  name_ja: 新谷 真由
  name_kana: しんたに まゆ
  title: 教授
  affiliation: 芝浦工業大学 工学部
  # トップページで、上の affiliation に続けて表示する所属です。
  # 【提供】2026-08-25 新谷先生より（所属が増えているとのこと）
  affiliation_lines:
    - 機械工学課程 機械機能工学科、先進機械コース
    - 理工学研究科 修士課程機械工学専攻、博士課程機能制御システム専攻
  # 先生のご紹介文。メンバーページに表示されます。
  # 【提供】2026-08-25 新谷先生より
  profile: |-
    ことばの意味の成り立ちや使われ方、人の心理と行動の関係について研究してきました。私自身、文系と理系の境界を行き来してきたこともあり、学生にも文理の枠にとらわれず、それぞれの関心に応じて幅広いテーマや分析手法を扱ってもらっています。学生の「これを調べたら面白そう」という発想を大切にし、アイデアを研究として形にする過程を一緒に考えています。
  # 紹介文に続けて出す項目。増やしたいときは同じ形で足してください。
  profile_extra:
    - label: 趣味
      body: |-
        あまり趣味と言えるようなものはありませんが、強いて挙げれば、30年ほどモンテヴェルディの演奏を聴き比べています。とはいえ、評論めいたことは何も言えず、ただ心地よく聴いているだけです。あとは、統計の参考書を読むことかもしれません。
    - label: 性格
      body: |-
        コテコテの関西人ですが、人生の半分以上を関東平野で過ごしています。人と話していると、なぜか何かを期待されているような錯覚に陥り、「とりあえずおもろいこと言わなあかん」という衝動に駆られます。そういうときは「大丈夫ですよ」と言って下さい。
  links:
    researchmap: https://researchmap.jp/mayushintani
    university: https://www.shibaura-it.ac.jp/faculty/laboratory/00146.html

