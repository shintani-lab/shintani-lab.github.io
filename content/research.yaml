themes:
  - 心理特性・個人属性を説明変数としたコードスイッチング生起の予測モデル（中国語）
  - 生成AIに対する英語学習者の捉え方のテキストマイニング分析
  - 工学系人材のコミュニケーション能力とその育成に関する調査
  - Spotifyメタデータと歌詞を組み合わせたJ-Popの人気度予測のモデル開発
  - 英語学習へ向かう心理状態を測定する尺度の構築
  - 言語データと心理状態に基づく不気味の谷現象の解明

