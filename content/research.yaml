# トップページの冒頭に出る紹介文。
# 【提供】2026-08-25 新谷先生より「教育や学習」を追記。
# ※ 下の introduction（研究内容ページ用）とは意図的に文言が異なります。
#    先生より「研究内容ページの1段落目は書き換え不要」とのご指示によるものです。
lead_top: |-
  認知言語学・言語データ分析研究室では、ことば、コミュニケーション、人の認知や心理、教育や学習に関わるさまざまな現象をデータとして捉え、その背後にある構造や関係性を明らかにする研究を行っています。

# 研究室紹介文（3段落）
# ※ 3段落目は Join Us ページの冒頭にも使われます。必ず3段落書いてください。
introduction:
  - 認知言語学・言語データ分析研究室では、ことば、コミュニケーション、人の認知や心理に関わるさまざまな現象をデータとして捉え、その背後にある構造や関係性を明らかにする研究を行っています。
  - テキストデータや質問紙調査、心理状態、学習・行動データなどを対象に、Python等によるデータ処理、テキストマイニング、心理測定、統計解析などの手法を用いて分析し、得られた結果を言語学、心理学、認知科学、教育工学などの視点から解釈します。
  - 研究対象は、ことばの意味や使用から、学習者の心理、異文化コミュニケーション、人とAIとの関わりまで多岐にわたります。文系・理系という枠を越えて、人や社会に関わる問いをデータから数理的に明らかにすることを目指しています。

# 研究分野（先生ご提供の6項目。この順序・表記のまま掲載する）
fields:
  - 言語データ分析（テキストマイニング）
  - Pythonを用いたデータ分析
  - 認知言語学
  - 心理測定
  - 教育工学
  - 統計解析

# 研究のアプローチ（完成イメージ画像の4ステップ構成）
# ★ 先生からの原稿には含まれていない。画像から起こしたもののため、
#    掲載するか、掲載する場合の文言を確認する。
approach:
  - step: 1
    title: データの収集
    body: テキスト、質問紙調査、学習・行動データなど、多様なデータを収集します。
  - step: 2
    title: Pythonやソフトウェアによる処理・分析
    body: テキストマイニングや統計解析の手法を用いて、データの構造を抽出します。
  - step: 3
    title: 可視化
    body: 分析結果を可視化し、見えにくい関係性を捉えられる形にします。
  - step: 4
    title: 解釈と応用
    body: 言語学、心理学、認知科学、教育工学の視点から結果を解釈します。

# 研究室の研究テーマ
# 【提供】2026-08-25 新谷先生より。
# 配属を検討する学生が見る箇所のため、学生個々の題目より抽象度を上げた表現にしています。
themes:
  - 人の心理状態とことばの使い方の関係分析
  - 社会・文化現象の言語使用や行動からの分析
  - 外国語学習者の心理・態度・行動の測定とモデル化
  - 生成AI・機械翻訳の言語処理能力の分析と評価
  - Industry5.0時代の工学系人材のスキル調査と教育介入

