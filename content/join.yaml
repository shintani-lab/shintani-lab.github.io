# ゼミの実施日
seminar:
  intro: |-
    豊洲キャンパスにて毎週水曜3〜5限に実施しています。おおむね以下の時間帯での実施となります。詳細はお問い合わせください。
  slots:
    - 学部4年生・大学院生合同ゼミ：水曜3・4限
    - 学部3年生ゼミ：水曜4・5限
    - 大学院生の個別指導：スケジュールを調整し、他曜日に実施
  note: 定期的にお疲れ様会（懇親会）も実施しています！

# 大学院進学・留学生の受け入れ
# 【出典】大学公式ページの記載を、2026-08-28 先生の了承を得て掲載
admission:
  - label: 大学院進学を検討する方へ
    body: |-
      本学大学院（修士課程・博士課程）において、当研究室での指導を希望される方は、事前にご相談ください。
  - label: 留学生の受け入れ
    body: |-
      日本の学生ビザを所持している留学生の受け入れが可能です（実績あり）。ご希望の場合は、事前にご相談ください。

